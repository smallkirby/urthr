name: Runtime Tests (QEMU Q35 x64)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  ZIG_VERSION: 0.17.0

jobs:
  runtime_test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/${{ github.repository_owner }}/urthr:latest
    strategy:
      fail-fast: false
      matrix:
        BUILD_TYPE: [Debug, ReleaseSafe, ReleaseFast]
        IOMMU: [false, true]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependency
        run: |
          apt update
          apt install -y \
            git \
            sudo \
            binutils \
            curl \
            wget \
            tar \
            xz-utils \
            cpp \
            mtools \
            dosfstools \
            parted \
            python3

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Runtime Tests (Q35)
        run: |
          zig build install --summary all \
            -Dlog_level=debug \
            -Doptimize=${{ matrix.BUILD_TYPE }} \
            -Dboard=q35 \
            -Dqemu=$QEMU_DIR/bin \
            -Diommu=${{ matrix.IOMMU }} \
            -Drtt \
            -Drestart \
            -Dinit=/bin/utest \
            -Dallow_init_exit

          python3 -m http.server 18080 --bind 0.0.0.0 1>/dev/null &
          python3 ./scripts/tests/fake_dns_server.py 1>/dev/null &

          set +e
          zig build run --summary all \
            -Dlog_level=debug \
            -Doptimize=${{ matrix.BUILD_TYPE }} \
            -Dboard=q35 \
            -Dqemu=$QEMU_DIR/bin \
            -Diommu=${{ matrix.IOMMU }} \
            -Drtt \
            -Drestart \
            -Dinit=/bin/utest \
            -Dinit_args="!bench" \
            -Dallow_init_exit
          status=$?

          kill %1 %2

          exit $status
