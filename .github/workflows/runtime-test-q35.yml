name: Runtime Tests (QEMU Q35 Machine)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  ZIG_VERSION: 0.16.0

jobs:
  runtime_test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        BUILD_TYPE: [Debug, ReleaseSafe, ReleaseFast]
      max-parallel: 1

    steps:
      - uses: actions/checkout@v3
        with:
          lfs: true

      - name: Install dependency
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            sudo \
            binutils \
            curl \
            wget \
            tar \
            xz-utils \
            mtools \
            dosfstools \
            qemu-system-x86

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Runtime Tests (Q35)
        run: |
          zig build install --summary all \
            -Dlog_level=debug \
            -Doptimize=${{ matrix.BUILD_TYPE }} \
            -Dboard=q35 \
            -Dqemu=/usr/bin \
            -Drtt \
            -Drestart \
            -Didle_watchdog=30 \
            -Dinit=/boot/bin/utest \
            -Dallow_init_exit

          python3 -m http.server 18080 --bind 0.0.0.0 1>/dev/null &

          set +e
          zig build run --summary all \
            -Dlog_level=debug \
            -Doptimize=${{ matrix.BUILD_TYPE }} \
            -Dboard=q35 \
            -Dqemu=/usr/bin \
            -Drtt \
            -Drestart \
            -Didle_watchdog=30 \
            -Dinit=/boot/bin/utest \
            -Dallow_init_exit
          status=$?

          kill %1

          exit $status
